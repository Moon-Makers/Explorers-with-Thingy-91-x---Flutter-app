<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#F8FAFC" stroke="#2563EB" stroke-width="4"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Cardinal Direction Lines and Labels -->
  <!-- North -->
  <line x1="100" y1="10" x2="100" y2="30" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="50" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#DC2626">N</text>
  
  <!-- Northeast -->
  <line x1="160.61" y1="39.39" x2="153.54" y2="46.46" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="148" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748B">NE</text>
  
  <!-- East -->
  <line x1="190" y1="100" x2="170" y2="100" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#6B7280">E</text>
  
  <!-- Southeast -->
  <line x1="160.61" y1="160.61" x2="153.54" y2="153.54" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="148" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748B">SE</text>
  
  <!-- South -->
  <line x1="100" y1="190" x2="100" y2="170" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="165" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#6B7280">S</text>
  
  <!-- Southwest -->
  <line x1="39.39" y1="160.61" x2="46.46" y2="153.54" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748B">SW</text>
  
  <!-- West -->
  <line x1="10" y1="100" x2="30" y2="100" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <text x="45" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#6B7280">W</text>
  
  <!-- Northwest -->
  <line x1="39.39" y1="39.39" x2="46.46" y2="46.46" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748B">NW</text>
  
  <!-- Degree marks -->
  <g stroke="#9CA3AF" stroke-width="1" opacity="0.6">
    <!-- 15 degree marks -->
    <line x1="113.4" y1="17.32" x2="109.64" y2="21.34" stroke-linecap="round"/>
    <line x1="126.8" y1="26.8" x2="122.68" y2="30.64" stroke-linecap="round"/>
    <line x1="139.39" y1="39.39" x2="135.36" y2="43.64" stroke-linecap="round"/>
    <line x1="150" y1="54.28" x2="145.7" y2="58.18" stroke-linecap="round"/>
    
    <!-- Continue for other quadrants -->
    <line x1="158.68" y1="70.71" x2="154.28" y2="74.28" stroke-linecap="round"/>
    <line x1="165.36" y1="88.4" x2="160.61" y2="91.6" stroke-linecap="round"/>
    <line x1="169.64" y1="107.32" x2="164.64" y2="109.64" stroke-linecap="round"/>
    <line x1="171.32" y1="126.8" x2="166.18" y2="128.68" stroke-linecap="round"/>
    
    <!-- And so on for all 24 marks -->
  </g>
  
  <!-- Compass Needle -->
  <g>
    <!-- North pointer (red arrow) -->
    <polygon points="100,40 92,100 108,100" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
    <!-- North pointer highlight -->
    <polygon points="100,40 96,80 104,80" fill="#EF4444" opacity="0.8"/>
    
    <!-- South pointer (dark arrow) -->
    <polygon points="100,160 92,100 108,100" fill="#374151" stroke="#1F2937" stroke-width="2"/>
    <!-- South pointer highlight -->
    <polygon points="100,160 96,120 104,120" fill="#4B5563" opacity="0.8"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="100" cy="100" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="100" cy="100" r="4" fill="#3B82F6"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  
  <!-- Brand text at bottom -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#94A3B8" opacity="0.7">COMPASS</text>
</svg>
