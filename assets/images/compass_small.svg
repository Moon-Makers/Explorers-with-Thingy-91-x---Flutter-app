<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="30" cy="30" r="28" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
  
  <!-- Inner Circle -->
  <circle cx="30" cy="30" r="22" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Cardinal Direction Markers -->
  <!-- North -->
  <line x1="30" y1="5" x2="30" y2="12" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <text x="30" y="20" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="#DC2626">N</text>
  
  <!-- East -->
  <line x1="48" y1="30" x2="55" y2="30" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- South -->
  <line x1="30" y1="48" x2="30" y2="55" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- West -->
  <line x1="5" y1="30" x2="12" y2="30" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Compass Needle -->
  <g>
    <!-- North pointer (red) -->
    <polygon points="30,12 27,30 33,30" fill="#DC2626" stroke="#B91C1C" stroke-width="1"/>
    <!-- South pointer (dark) -->
    <polygon points="30,48 27,30 33,30" fill="#374151" stroke="#1F2937" stroke-width="1"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="30" cy="30" r="3" fill="#2563EB" stroke="#FFFFFF" stroke-width="1"/>
</svg>
