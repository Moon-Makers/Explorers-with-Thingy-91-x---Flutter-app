  <!-- Hat Band -->
  <rect x="63" y="60" width="24" height="4" fill="#DC2626" rx="2"/>
  <!-- Hat Buckle -->
  <rect x="72" y="58" width="6" height="8" fill="#FCD34D" stroke="#F59E0B" stroke-width="1" rx="1"/>
  <rect x="73.5" y="59.5" width="3" height="5" fill="none" stroke="#F59E0B" stroke-width="1" rx="0.5"/>
  
  <!-- Face -->
  <circle cx="75" cy="82" r="18" fill="#F3E8D0" stroke="#E5D4B1" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="69" cy="78" r="2.5" fill="#374151"/>
  <circle cx="81" cy="78" r="2.5" fill="#374151"/>
  <!-- Eye sparkles -->
