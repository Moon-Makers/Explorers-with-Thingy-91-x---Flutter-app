<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="75" cy="75" r="72" fill="none" stroke="#2563EB" stroke-width="4"/>
  
  <!-- Inner Circle -->
  <circle cx="75" cy="75" r="60" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Witch Hat -->
