  <circle cx="25" cy="75" r="1" fill="#DC2626"/>
  <circle cx="125" cy="75" r="1" fill="#DC2626"/>
  
  <!-- Moon phases around the border -->
  <circle cx="75" cy="15" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <path d="M75 15 A3 3 0 0 1 75 21 A2 2 0 0 0 75 15" fill="#374151"/>
  
  <circle cx="135" cy="75" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <path d="M135 75 A3 3 0 0 1 135 81 A2 2 0 0 0 135 75" fill="#374151"/>
  
  <circle cx="75" cy="135" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <path d="M75 135 A3 3 0 0 1 75 141 A2 2 0 0 0 75 135" fill="#374151"/>
  
  <circle cx="15" cy="75" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <path d="M15 75 A3 3 0 0 1 15 81 A2 2 0 0 0 15 75" fill="#374151"/>
