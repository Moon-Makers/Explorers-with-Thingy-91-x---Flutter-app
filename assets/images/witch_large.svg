  <circle cx="82" cy="77" r="0.8" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <path d="M75 80 L72 87 L78 87 Z" fill="#E5D4B1" stroke="#D1C7B0" stroke-width="1"/>
