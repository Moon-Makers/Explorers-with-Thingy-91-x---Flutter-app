  <path d="M113 101 L114 98 L116 99 L115 96 L117 95 L115 94 L115.5 92 L113 93 L112 91 L111 93 L109 92 L109.5 94 L107 95 L109 96 L108 99 L110 98 Z" fill="#FFFFFF"/>
  
  <!-- Magic sparkles around -->
  <circle cx="35" cy="35" r="2" fill="#FCD34D"/>
  <path d="M35 35 L36 33 L37 35 L36 37 Z" fill="#FFFFFF"/>
  
  <circle cx="115" cy="45" r="1.5" fill="#FCD34D"/>
  <path d="M115 45 L116 44 L117 45 L116 46 Z" fill="#FFFFFF"/>
  
  <circle cx="30" cy="115" r="1.5" fill="#FCD34D"/>
  <path d="M30 115 L31 114 L32 115 L31 116 Z" fill="#FFFFFF"/>
  
  <circle cx="120" cy="120" r="2" fill="#FCD34D"/>
  <path d="M120 120 L121 118 L122 120 L121 122 Z" fill="#FFFFFF"/>
  
