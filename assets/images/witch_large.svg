  <path d="M57 78 Q52 85 56 92" fill="#8B5A3C" stroke="#6B4226" stroke-width="1.5"/>
  <path d="M93 78 Q98 85 94 92" fill="#8B5A3C" stroke="#6B4226" stroke-width="1.5"/>
  
  <!-- Body/Cloak -->
  <path d="M52 100 Q75 97 98 100 L93 128 Q75 132 57 128 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="3"/>
