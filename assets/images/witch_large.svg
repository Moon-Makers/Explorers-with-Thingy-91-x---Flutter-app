  <circle cx="107" cy="107" r="1" fill="#6B4226"/>
  <!-- Star at wand tip -->
  <path d="M113 101 L115 96 L120 98 L117 93 L122 91 L117 89 L119 84 L113 86 L111 81 L109 86 L103 84 L105 89 L100 91 L105 93 L102 98 L107 96 Z" fill="#FCD34D" stroke="#F59E0B" stroke-width="1"/>
