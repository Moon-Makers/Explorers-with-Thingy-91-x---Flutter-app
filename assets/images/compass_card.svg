<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="needleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="47" fill="url(#backgroundGradient)" stroke="#2563EB" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Inner compass ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Cardinal direction markers -->
  <!-- North marker (prominent) -->
  <line x1="50" y1="8" x2="50" y2="18" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">N</text>
  
  <!-- East marker -->
  <line x1="82" y1="50" x2="92" y2="50" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <text x="75" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">E</text>
  
  <!-- South marker -->
  <line x1="50" y1="82" x2="50" y2="92" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">S</text>
  
  <!-- West marker -->
  <line x1="8" y1="50" x2="18" y2="50" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <text x="25" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">W</text>
  
  <!-- Compass needle -->
  <g>
    <!-- North pointer (red, prominent) -->
    <polygon points="50,22 46,50 54,50" fill="url(#needleGradient)" stroke="#B91C1C" stroke-width="0.5"/>
    <!-- South pointer (dark) -->
    <polygon points="50,78 46,50 54,50" fill="#374151" stroke="#1F2937" stroke-width="0.5"/>
  </g>
  
  <!-- Center pivot point -->
  <circle cx="50" cy="50" r="3.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="1.5" fill="#FFFFFF"/>
  
  <!-- Subtle degree marks -->
  <g stroke="#9CA3AF" stroke-width="0.8" opacity="0.5">
    <!-- 45 degree marks -->
    <line x1="67.68" y1="17.68" x2="65.86" y2="19.5" stroke-linecap="round"/>
    <line x1="82.32" y1="32.32" x2="80.5" y2="34.14" stroke-linecap="round"/>
    <line x1="82.32" y1="67.68" x2="80.5" y2="65.86" stroke-linecap="round"/>
    <line x1="67.68" y1="82.32" x2="65.86" y2="80.5" stroke-linecap="round"/>
    <line x1="32.32" y1="82.32" x2="34.14" y2="80.5" stroke-linecap="round"/>
    <line x1="17.68" y1="67.68" x2="19.5" y2="65.86" stroke-linecap="round"/>
    <line x1="17.68" y1="32.32" x2="19.5" y2="34.14" stroke-linecap="round"/>
    <line x1="32.32" y1="17.68" x2="34.14" y2="19.5" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative compass rose elements -->
  <g opacity="0.3">
    <!-- Small decorative lines at 22.5 degree intervals -->
    <line x1="58.77" y1="12.35" x2="57.59" y2="14.12" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="41.23" y1="12.35" x2="42.41" y2="14.12" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="87.65" y1="41.23" x2="85.88" y2="42.41" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="87.65" y1="58.77" x2="85.88" y2="57.59" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="58.77" y1="87.65" x2="57.59" y2="85.88" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="41.23" y1="87.65" x2="42.41" y2="85.88" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="12.35" y1="58.77" x2="14.12" y2="57.59" stroke="#9CA3AF" stroke-width="0.5"/>
    <line x1="12.35" y1="41.23" x2="14.12" y2="42.41" stroke="#9CA3AF" stroke-width="0.5"/>
  </g>
</svg>
