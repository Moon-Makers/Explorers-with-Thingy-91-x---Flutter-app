<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="#2563EB" stroke-width="2"/>
  
  <!-- Witch Hat -->
  <path d="M28 36 L40 12 L52 36 Z" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <!-- Hat Brim -->
  <ellipse cx="40" cy="36" rx="14" ry="3" fill="#374151" stroke="#1F2937" stroke-width="1"/>
  <!-- Hat Band -->
  <rect x="34" y="32" width="12" height="2" fill="#DC2626" rx="1"/>
  
  <!-- Face -->
  <circle cx="40" cy="44" r="9" fill="#F3E8D0" stroke="#E5D4B1" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="37" cy="42" r="1" fill="#374151"/>
  <circle cx="43" cy="42" r="1" fill="#374151"/>
  
  <!-- Nose -->
  <path d="M40 43 L38.5 46 L41.5 46 Z" fill="#E5D4B1" stroke="#D1C7B0" stroke-width="0.5"/>
  
  <!-- Mouth -->
  <path d="M37.5 47 Q40 49 42.5 47" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Hair -->
  <path d="M32 40 Q28 44 30 48" fill="#8B5A3C" stroke="#6B4226" stroke-width="1"/>
  <path d="M48 40 Q52 44 50 48" fill="#8B5A3C" stroke="#6B4226" stroke-width="1"/>
  
  <!-- Body/Cloak -->
  <path d="M28 54 Q40 52 52 54 L50 68 Q40 70 30 68 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  
  <!-- Arms -->
  <ellipse cx="28" cy="58" rx="3" ry="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1"/>
  <ellipse cx="52" cy="58" rx="3" ry="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1"/>
  
  <!-- Hands -->
  <circle cx="26" cy="60" r="2" fill="#F3E8D0" stroke="#E5D4B1" stroke-width="0.8"/>
  <circle cx="54" cy="60" r="2" fill="#F3E8D0" stroke="#E5D4B1" stroke-width="0.8"/>
  
  <!-- Magic Wand -->
  <line x1="54" y1="60" x2="60" y2="54" stroke="#8B5A3C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Star -->
  <path d="M60 54 L61 52 L63 52.5 L62 50 L64 49 L62 48 L62.5 46 L60 47 L59 45 L58 47 L56 46 L56.5 48 L54 49 L56 50 L55 52.5 L57 52 Z" fill="#FCD34D" stroke="#F59E0B" stroke-width="0.3"/>
  
  <!-- Decorative stars -->
  <circle cx="20" cy="20" r="1" fill="#FCD34D"/>
  <circle cx="60" cy="24" r="0.8" fill="#FCD34D"/>
  <circle cx="16" cy="60" r="0.8" fill="#FCD34D"/>
  <circle cx="64" cy="64" r="1" fill="#FCD34D"/>
