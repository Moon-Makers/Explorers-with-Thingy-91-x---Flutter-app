<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#2563EB" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Cardinal Direction Markers -->
  <!-- North -->
  <line x1="50" y1="5" x2="50" y2="15" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#DC2626">N</text>
  
  <!-- East -->
  <line x1="85" y1="50" x2="95" y2="50" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="75" y="54" text-anchor="middle" font-family="Arial" font-size="8" fill="#6B7280">E</text>
  
  <!-- South -->
  <line x1="50" y1="85" x2="50" y2="95" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="80" text-anchor="middle" font-family="Arial" font-size="8" fill="#6B7280">S</text>
  
  <!-- West -->
  <line x1="5" y1="50" x2="15" y2="50" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="25" y="54" text-anchor="middle" font-family="Arial" font-size="8" fill="#6B7280">W</text>
  
  <!-- Compass Needle -->
  <g>
    <!-- North pointer (red) -->
    <polygon points="50,20 46,50 54,50" fill="#DC2626" stroke="#B91C1C" stroke-width="1"/>
    <!-- South pointer (dark) -->
    <polygon points="50,80 46,50 54,50" fill="#374151" stroke="#1F2937" stroke-width="1"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Degree marks -->
  <g stroke="#9CA3AF" stroke-width="1">
    <!-- 30 degree marks -->
    <line x1="75" y1="13.4" x2="73" y2="17" stroke-linecap="round"/>
    <line x1="86.6" y1="25" x2="83" y2="27" stroke-linecap="round"/>
    <line x1="86.6" y1="75" x2="83" y2="73" stroke-linecap="round"/>
    <line x1="75" y1="86.6" x2="73" y2="83" stroke-linecap="round"/>
    <line x1="25" y1="86.6" x2="27" y2="83" stroke-linecap="round"/>
    <line x1="13.4" y1="75" x2="17" y2="73" stroke-linecap="round"/>
    <line x1="13.4" y1="25" x2="17" y2="27" stroke-linecap="round"/>
    <line x1="25" y1="13.4" x2="27" y2="17" stroke-linecap="round"/>
  </g>
</svg>
